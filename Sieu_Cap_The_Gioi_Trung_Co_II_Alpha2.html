<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Siêu Cấp Thế Giới Trung Cổ II Alpha 2</title>
<style>
html,body{margin:0;overflow:hidden;background:#000}
#hud{position:absolute;top:10px;left:10px;color:#fff;background:rgba(0,0,0,.5);padding:10px;border-radius:8px;font-family:Arial;z-index:10}
#joy{position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,.15);touch-action:none;z-index:10}
#stick{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.7)}
#attack{position:absolute;right:20px;bottom:30px;width:90px;height:90px;border-radius:45px;border:none;background:#b33;color:#fff;font-size:30px;z-index:10}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.8);color:#fff;z-index:20;font-family:Arial}
button{cursor:pointer}
</style>
</head>
<body>
<div id="hud">Loading...</div>
<div id="joy"><div id="stick"></div></div>
<button id="attack">⚔</button>
<div id="overlay"><h1 id="msg"></h1><button onclick="location.reload()">Chơi lại</button></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9fc5e8);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(50,60,30);
scene.add(sun);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),
new THREE.MeshLambertMaterial({color:0x5e7d4b}));
ground.rotation.x=-Math.PI/2;
scene.add(ground);

function tree(x,z){
 const g=new THREE.Group();
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,3,6),new THREE.MeshLambertMaterial({color:0x6A4A32}));
 t.position.y=1.5;
 const l=new THREE.Mesh(new THREE.ConeGeometry(2,3,6),new THREE.MeshLambertMaterial({color:0x2F6B2F}));
 l.position.y=4;
 g.add(t,l); g.position.set(x,0,z); scene.add(g);
}
for(let i=0;i<60;i++) tree(Math.random()*300-150,Math.random()*300-150);

function house(x,z){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.BoxGeometry(5,3,5),new THREE.MeshLambertMaterial({color:0x8b5a2b}));
 b.position.y=1.5;
 const r=new THREE.Mesh(new THREE.ConeGeometry(4,2.5,4),new THREE.MeshLambertMaterial({color:0x5a2e12}));
 r.position.y=4; r.rotation.y=Math.PI/4;
 g.add(b,r); g.position.set(x,0,z); scene.add(g);
}
house(10,10); house(-10,10); house(15,-12);

function createKnight(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.9,1.2,.6),new THREE.MeshLambertMaterial({color:0x3D5A80}));
 body.position.y=1.2;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.35,10,10),new THREE.MeshLambertMaterial({color:0xE6C19C}));
 head.position.y=2.1;
 g.add(body,head);
 return g;
}

function createGoblin(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.5),new THREE.MeshLambertMaterial({color:0x5B3A29}));
 body.position.y=1;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.45,8,8),new THREE.MeshLambertMaterial({color:0x4E8A45}));
 head.position.y=1.9;
 g.add(body,head);
 g.userData={hp:40,maxHp:40,dead:false,rewarded:false,xpReward:25};
 return g;
}

const player=createKnight();
scene.add(player);

const stats={hp:100,maxHp:100,xp:0,level:1,next:100,gold:0,damage:15};
const enemies=[];
const loot=[];

function spawnGoblin(){
 const e=createGoblin();
 e.position.set(Math.random()*60-30,0,Math.random()*60-30);
 scene.add(e);
 enemies.push(e);
}
for(let i=0;i<8;i++) spawnGoblin();

let joyX=0,joyY=0;
const joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{
 e.preventDefault();
 const r=joy.getBoundingClientRect(),t=e.touches[0];
 let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
 const m=Math.hypot(dx,dy),lim=35;
 if(m>lim){dx=dx/m*lim;dy=dy/m*lim;}
 joyX=dx/lim; joyY=dy/lim;
 stick.style.left=(40+dx)+'px'; stick.style.top=(40+dy)+'px';
},{passive:false});
joy.addEventListener('touchend',()=>{joyX=joyY=0;stick.style.left='40px';stick.style.top='40px';});

function dropGold(pos){
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.1,10),new THREE.MeshLambertMaterial({color:0xffd700}));
 c.rotation.x=Math.PI/2;
 c.position.copy(pos);
 c.userData={value:5+Math.floor(Math.random()*10)};
 scene.add(c); loot.push(c);
}

function enemyDie(e){
 if(e.userData.rewarded) return;
 e.userData.rewarded=true;
 e.userData.dead=true;
 e.userData.deathTime=performance.now();
 stats.xp+=e.userData.xpReward;
 dropGold(e.position);
 e.rotation.z=Math.PI/2;
}

document.getElementById('attack').onclick=()=>{
 for(const e of enemies){
  if(e.userData.dead) continue;
  if(player.position.distanceTo(e.position)<3){
   e.userData.hp-=stats.damage;
   if(e.userData.hp<=0) enemyDie(e);
  }
 }
};

function levelCheck(){
 if(stats.xp>=stats.next){
  stats.xp-=stats.next;
  stats.level++;
  stats.next=Math.floor(stats.next*1.5);
  stats.maxHp+=20;
  stats.hp=stats.maxHp;
  stats.damage+=5;
 }
}

function endGame(text){
 document.getElementById('msg').textContent=text;
 document.getElementById('overlay').style.display='flex';
}

function hud(){
 document.getElementById('hud').innerHTML=
 `HP:${Math.floor(stats.hp)}/${stats.maxHp}<br>LV:${stats.level}<br>XP:${stats.xp}/${stats.next}<br>Gold:${stats.gold}`;
}

function animate(){
 requestAnimationFrame(animate);

 player.position.x+=joyX*0.12;
 player.position.z+=joyY*0.12;

 const now=performance.now();

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];

  if(e.userData.dead){
   if(now-e.userData.deathTime>10000){
    scene.remove(e);
    enemies.splice(i,1);
    spawnGoblin();
   }
   continue;
  }

  const dir=new THREE.Vector3().subVectors(player.position,e.position);
  const d=dir.length();

  if(d>1){dir.normalize(); e.position.addScaledVector(dir,0.03);}
  if(d<1.8) stats.hp-=0.03;
 }

 for(let i=loot.length-1;i>=0;i--){
  const item=loot[i];
  if(player.position.distanceTo(item.position)<2){
   stats.gold+=item.userData.value;
   scene.remove(item);
   loot.splice(i,1);
  }
 }

 levelCheck();

 if(stats.hp<=0) endGame("GAME OVER");
 if(stats.level>=5) endGame("CHIẾN THẮNG");

 camera.position.set(player.position.x,6,player.position.z+8);
 camera.lookAt(player.position);

 hud();
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
